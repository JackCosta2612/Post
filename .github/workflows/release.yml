name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Test
        run: ./test.sh
      - name: Build and verify
        run: |
          POST_SIGNING_IDENTITY=- ./build.sh
          codesign --verify --deep --strict ../Post.app
      - name: Package source
        run: git archive --format=zip --prefix="Post-${GITHUB_REF_NAME}/" HEAD -o "Post-${GITHUB_REF_NAME}-source.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Post-${GITHUB_REF_NAME}-source.zip" --title "Post $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
